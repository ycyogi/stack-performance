name: iOS (Ad Hoc IPA)

on:
  workflow_dispatch:

jobs:
  build-adhoc-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # React Native 0.83 requires Xcode >= 16.1
          xcode-version: '16.2'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Install signing cert + provisioning profile
        env:
          IOS_SIGNING_CERT_P12_BASE64: ${{ secrets.IOS_SIGNING_CERT_P12_BASE64 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$IOS_SIGNING_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$IOS_ADHOC_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          security import /tmp/cert.p12 -k build.keychain -P "$IOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

          echo "Code signing identities in CI keychain:"
          security find-identity -v -p codesigning build.keychain || true

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          if [ -z "$UUID" ]; then
            echo "ERROR: Could not extract UUID from provisioning profile" >&2
            exit 1
          fi
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Build Ad Hoc IPA (fastlane)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: bundle exec fastlane ios adhoc

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackPerformance-ipa
          path: artifacts/StackPerformance.ipa
