name: iOS (Ad Hoc IPA)

on:
  workflow_dispatch:

jobs:
  build-adhoc-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # React Native 0.83 requires Xcode >= 16.1
          xcode-version: '16.1'

      - name: Xcode/SDK sanity check
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          ls -1 /Applications | grep Xcode || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Install signing cert + provisioning profile
        env:
          IOS_SIGNING_CERT_P12_BASE64: ${{ secrets.IOS_SIGNING_CERT_P12_BASE64 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          set -x
          trap 'echo "❌ Failed at line $LINENO: $BASH_COMMAND" >&2' ERR

          echo "macOS: $(sw_vers)"
          echo "Xcode: $(xcodebuild -version || true)"
          echo "whoami: $(whoami)"

          : "${KEYCHAIN_PASSWORD:?Missing KEYCHAIN_PASSWORD secret}"

          echo "$IOS_SIGNING_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$IOS_ADHOC_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Ensure the build keychain is in the user search list so codesign/xcodebuild can find identities
          security list-keychains -d user -s build.keychain

          echo "🔐 Keychains (user):"
          security list-keychains -d user || true
          echo "🔐 Default keychain:"
          security default-keychain || true

          # -A grants access to all apps; easiest for CI
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_SIGNING_CERT_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          echo "🔎 Code signing identities (default search list):"
          security find-identity -v -p codesigning || true

          echo "🔎 Code signing identities in CI keychain:"
          security find-identity -v -p codesigning build.keychain || true

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "📄 Decode provisioning profile → plist"
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist

          echo "📄 Profile fields:"
          /usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist || true
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/profile.plist || true

          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          if [ -z "$UUID" ]; then
            echo "ERROR: Could not extract UUID from provisioning profile" >&2
            exit 1
          fi

          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "📄 Provisioning Profiles dir:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true

      - name: Build Ad Hoc IPA (fastlane)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: bundle exec fastlane ios adhoc --verbose

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StackPerformance-ipa
          path: artifacts/StackPerformance.ipa
